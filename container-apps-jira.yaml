apiVersion: 2023-05-01
location: koreacentral
name: mcp-jira-service
properties:
  managedEnvironmentId: /subscriptions/sub-az01-co001501-sbox-poc-131/resourceGroups/rg-az01-co001501-sbox-poc-131/providers/Microsoft.App/managedEnvironments/mcp-test
  configuration:
    ingress:
      external: true
      targetPort: 9000
      transport: http
      allowInsecure: false
    secrets:
      - name: jira-url
        value: "https://your-domain.atlassian.net"
  template:
    containers:
      - name: mcp-jira
        image: ghcr.io/sooperset/mcp-atlassian-jira:latest
        env:
          - name: JIRA_URL
            secretRef: jira-url
          - name: TRANSPORT
            value: "streamable-http"
          - name: PORT
            value: "9000"
          - name: HOST
            value: "0.0.0.0"
          - name: STREAMABLE_HTTP_PATH
            value: "/mcp"
          - name: MCP_LOGGING_STDOUT
            value: "true"
          - name: MCP_VERBOSE
            value: "true"
        resources:
          cpu: 0.5
          memory: 1Gi
        probes:
          - type: readiness
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
          - type: liveness
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 60
    scale:
      minReplicas: 1
      maxReplicas: 10
      rules:
        - name: http-rule
          http:
            metadata:
              concurrentRequests: "100"
            auth:
              - secretRef: jira-url
                triggerParameter: jira-url 